    <script>
        // Note: The correct answer is at index 0 in the source, but the JavaScript shuffles them randomly at runtime!
        const questions = [
          { q: "What is management defined as in the learning material?", options: ["The art of making profits", "The process of planning, organizing, leading, and controlling resources to achieve organizational goals", "The process of hiring and firing employees", "The science of production"], a: 1, e: "Management is defined as the process of planning, organizing, leading, and controlling resources to achieve organizational goals efficiently and effectively." },

  { q: "Which ancient Indian text from the 4th Century BCE provides structured approaches to governance, economic policies, and military strategies?", options: ["Mahabharata", "Ramayana", "Arthashastra", "Upanishads"], a: 2, e: "Chanakya's Arthashastra (4th Century BCE) provides a structured approach to governance, economic policies, taxation, law enforcement, and military strategies." },

  { q: "Who helped Chandragupta establish a well-organized empire with hierarchical administration?", options: ["Lord Krishna", "Lord Rama", "Chanakya", "Shivaji Maharaj"], a: 2, e: "Chanakya helped Chandragupta establish a well-organized empire by implementing a hierarchical administration with ministers, local governors, and military officers." },

  { q: "In the Mahabharata, whose role as a guide highlights the importance of mentorship and strategic thinking in management?", options: ["Arjuna", "Lord Krishna", "Bhishma", "Draupadi"], a: 1, e: "Lord Krishna's role as a guide to Arjuna highlights the importance of mentorship and strategic thinking in management." },

  { q: "Which management concept does Lord Krishna's advice to Arjuna (focus on duty over emotions) resemble in modern business?", options: ["Emotional decision-making", "Rational, data-driven decisions", "Intuitive leadership", "Autocratic management"], a: 1, e: "Lord Krishna advised Arjuna to focus on duty (Karma Yoga) rather than emotions, similar to corporate leaders making rational, data-driven decisions." },

  { q: "In the Ramayana, Rama assigned Hanuman for which role?", options: ["Defense", "Intelligence", "Diplomacy", "Logistics"], a: 1, e: "Rama assigned roles based on skills — Hanuman for intelligence, Lakshmana for defense." },

  { q: "Which medieval Indian leader is cited in the learning material for exemplifying exceptional management skills through decentralized administration?", options: ["Akbar", "Aurangzeb", "Chhatrapati Shivaji Maharaj", "Chandragupta"], a: 2, e: "Chhatrapati Shivaji Maharaj exemplified exceptional management skills through his administration, military tactics, and strategic planning." },

  { q: "What was the name of Shivaji Maharaj's council of ministers?", options: ["Saptapradhan", "Ashta Pradhan", "Panchamandal", "Navratna"], a: 1, e: "Shivaji Maharaj established an efficient administrative system with ministers (Ashta Pradhan) handling various departments." },

  { q: "Shivaji Maharaj's replacement of the Jagirdari system with direct tax collection is an example of which management skill?", options: ["Military strategy", "Diplomatic alliance", "Revenue management", "Naval development"], a: 2, e: "Shivaji Maharaj implemented a fair revenue system, replacing the oppressive Jagirdari system with direct tax collection." },

  { q: "Which Indian industrial group pioneered modern industrial management in India by focusing on long-term planning and employee welfare?", options: ["Birla Group", "Tata Group", "Infosys", "Wipro"], a: 1, e: "The Tata Group pioneered modern industrial management in India, focusing on long-term planning, ethical business practices, and employee welfare." },

  { q: "Who introduced the Global Delivery Model (GDM) at Infosys?", options: ["Azim Premji", "N.R. Narayana Murthy", "J.R.D. Tata", "Ratan Tata"], a: 1, e: "Narayana Murthy introduced the Global Delivery Model (GDM) at Infosys, enabling remote project management." },

  { q: "Which company is credited with pioneering e-commerce in India, similar to Amazon's early model?", options: ["Paytm", "Zomato", "Flipkart", "Snapdeal"], a: 2, e: "Flipkart introduced online shopping in India, similar to Amazon's early model." },

  { q: "With globalization and economic liberalization in which decade did India witness rapid growth in business strategies?", options: ["1970s", "1980s", "1990s", "2000s"], a: 2, e: "With globalization and economic liberalization in the 1990s, India witnessed rapid growth in business strategies, human resource management, and financial planning." },

  { q: "Which is NOT one of the five functions of management listed in the material?", options: ["Planning", "Organizing", "Motivating", "Controlling"], a: 2, e: "The five functions of management listed are Planning, Organizing, Staffing, Directing, and Controlling. Motivating is not listed as a separate function." },

  { q: "What does the Planning function of management primarily involve?", options: ["Hiring employees", "Setting goals and determining best strategies", "Monitoring employee performance", "Assigning tasks to teams"], a: 1, e: "Planning involves setting goals, forecasting future conditions, and determining the best strategies to achieve objectives." },

  { q: "Which function of management focuses on arranging resources such as manpower, finances, and materials?", options: ["Planning", "Organizing", "Directing", "Controlling"], a: 1, e: "Organizing focuses on arranging resources such as manpower, finances, and materials in an efficient manner." },

  { q: "Staffing in management includes which of the following?", options: ["Setting goals and forecasting", "Recruitment, selection, training, and workforce planning", "Monitoring performance and correcting deviations", "Motivating employees through bonuses"], a: 1, e: "Staffing is the process of hiring, training, and managing employees. It includes recruitment, selection, training, and workforce planning." },

  { q: "Which management function involves motivating, guiding, and supervising employees?", options: ["Planning", "Organizing", "Directing", "Staffing"], a: 2, e: "Directing involves motivating, guiding, and supervising employees to ensure they work effectively towards the organization's goals." },

  { q: "Which management function ensures planned activities are executed properly by monitoring performance?", options: ["Organizing", "Staffing", "Planning", "Controlling"], a: 3, e: "Controlling ensures that planned activities are executed properly by monitoring performance, comparing actual results with set standards, and taking corrective actions." },

  { q: "Which company is cited as an example of achieving organizational goals by launching innovative products?", options: ["Google", "Microsoft", "Apple Inc.", "Amazon"], a: 2, e: "Apple Inc. sets goals for launching innovative products like iPhones and manages teams to achieve them." },

  { q: "Which company is cited as an example of enhancing efficiency through lean manufacturing?", options: ["Ford", "Toyota", "Honda", "Tesla"], a: 1, e: "Toyota uses lean manufacturing to reduce waste and improve production efficiency." },

  { q: "Netflix shifting from DVD rentals to online streaming is an example of which importance of management?", options: ["Achieves Organizational Goals", "Enhances Efficiency", "Facilitates Adaptability", "Improves Decision-Making"], a: 2, e: "Netflix shifted from DVD rentals to online streaming to remain competitive, illustrating how management facilitates adaptability to external changes." },

  { q: "Which company is cited as an example of ensuring employee satisfaction through flexible work hours?", options: ["Apple", "Toyota", "Google", "Amazon"], a: 2, e: "Google offers flexible work hours and creative spaces to keep employees motivated, demonstrating how management ensures employee satisfaction." },

  { q: "Tesla's investment in electric vehicle research demonstrates which importance of management?", options: ["Supports Economic Growth", "Encourages Innovation", "Ensures Employee Satisfaction", "Improves Decision-Making"], a: 1, e: "Tesla invests in electric vehicle research to stay ahead in the industry, illustrating how management encourages innovation." },

  { q: "Which characteristic of management states that its principles apply to businesses, governments, NGOs, and personal life?", options: ["Goal-Oriented", "Continuous Process", "Universal Application", "Multidisciplinary"], a: 2, e: "Universal Application means management principles apply to businesses, governments, NGOs, and personal life." },

  { q: "Nokia's failure to adapt to smartphone trends while Samsung innovated illustrates which characteristic of management?", options: ["Goal-Oriented", "Continuous Process", "People-Centric", "Dynamic in Nature"], a: 3, e: "Nokia failed to adapt to smartphone trends, while Samsung innovated and thrived, illustrating that management is Dynamic in Nature." },

  { q: "Which characteristic of management states that employees are a company's biggest asset?", options: ["Dynamic in Nature", "People-Centric", "Multidisciplinary", "Decision-Making Focused"], a: 1, e: "People-Centric: Employees are a company's biggest asset, and management focuses on their development." },

  { q: "Which management characteristic involves using knowledge from economics, psychology, sociology, and technology?", options: ["Goal-Oriented", "Universal Application", "Multidisciplinary", "Continuous Process"], a: 2, e: "Multidisciplinary: Management uses knowledge from economics, psychology, sociology, and technology." },

  { q: "Kodak's failure to adopt digital cameras represents which challenge in management?", options: ["Globalization", "Technological Advancements", "Workforce Diversity", "Ethical Issues"], a: 1, e: "Kodak failed to adopt digital cameras, losing to competitors like Canon, illustrating the challenge of Technological Advancements." },

  { q: "McDonald's offering different menus in India and Japan represents which challenge in management?", options: ["Technological Advancements", "Economic Uncertainty", "Globalization", "Change Management"], a: 2, e: "McDonald's offers different menus in India and Japan to suit local tastes, illustrating the challenge of Globalization." },

  { q: "Volkswagen faking emissions data is an example of which management challenge?", options: ["Globalization", "Workforce Diversity", "Ethical Issues", "Change Management"], a: 2, e: "Volkswagen faced backlash for faking emissions data in its diesel cars, illustrating the challenge of Ethical Issues." },

  { q: "Airlines struggling financially during COVID-19 pandemic represents which management challenge?", options: ["Change Management", "Sustainability Concerns", "Economic Uncertainty", "Technological Advancements"], a: 2, e: "Airlines struggled financially during the COVID-19 pandemic, illustrating the challenge of Economic Uncertainty." },

  { q: "IBM restructuring its workforce to shift from hardware to software represents which challenge?", options: ["Ethical Issues", "Change Management", "Sustainability Concerns", "Workforce Diversity"], a: 1, e: "IBM had to restructure its workforce to shift from hardware to software services, illustrating the challenge of Change Management." },

  { q: "According to F.W. Taylor, scientific management is the art of knowing exactly what you want your men to do and then seeing that they do it in the:", options: ["Most productive way", "Best and cheapest way", "Fastest and most innovative way", "Most ethical way"], a: 1, e: "According to F.W. Taylor: 'Scientific management is the art of knowing exactly what you want your men to do and then seeing that they do it in the best and cheapest way.'" },

  { q: "Which of Taylor's principles focuses on replacing the hit-and-trial method with scientific study?", options: ["Harmony, Not Discord", "Science, Not Rule of Thumb", "Cooperation, Not Individualism", "Development of Workers"], a: 1, e: "Science, Not Rule of Thumb: Taylor focused on the scientific study and analysis of each element of work to replace the old rule of thumb method." },

  { q: "Taylor's concept of 'Mental Revolution' relates to which principle?", options: ["Science, Not Rule of Thumb", "Development of Workers", "Cooperation, Not Individualism", "Harmony, Not Discord"], a: 3, e: "In Harmony, Not Discord, Taylor focused on 'Mental Revolution', which means that workers and managers should transform their thinking to work together." },

  { q: "Which of Taylor's principles states that competition should be replaced by cooperation?", options: ["Science, Not Rule of Thumb", "Harmony, Not Discord", "Cooperation, Not Individualism", "Development of Workers"], a: 2, e: "Cooperation, Not Individualism: There should be cooperation between management and workers instead of individualism, and competition should be replaced by cooperation." },

  { q: "Taylor's principle on worker development states that workers should be assigned work according to their:", options: ["Seniority", "Educational qualifications", "Mental, physical, and intellectual capabilities", "Previous salary"], a: 2, e: "Each worker should be scientifically selected and assigned work according to their mental, physical and intellectual capabilities." },

  { q: "Who is called the 'Father of Modern Management Theory'?", options: ["F.W. Taylor", "Henri Fayol", "Elton Mayo", "Peter Drucker"], a: 1, e: "Henry Fayol is called the Father of Modern Management Theory and introduced 14 principles of management." },

  { q: "How many principles of management did Henri Fayol introduce?", options: ["10", "12", "14", "16"], a: 2, e: "Henri Fayol introduced 14 principles of management." },

  { q: "Which Fayol principle states that segregating work among workers enhances quality and productivity?", options: ["Authority and Responsibility", "Unity of Command", "Division of Work", "Esprit de Corps"], a: 2, e: "Division of Work: Henri believed that segregating work in the workforce amongst the workers will enhance the quality of the product and improve productivity, efficiency, accuracy, and speed." },

  { q: "Which Fayol principle states that an employee should have only one boss?", options: ["Unity of Direction", "Scalar Chain", "Unity of Command", "Centralization"], a: 2, e: "Unity of Command: An employee should have only one boss and follow his command. If an employee has to follow more than one boss, there begins a conflict of interest." },

  { q: "Which Fayol principle states that all people in a company should have one goal and motive?", options: ["Unity of Command", "Unity of Direction", "Subordination of Individual Interest", "Esprit de Corps"], a: 1, e: "Unity of Direction: All the people working in a company should have one goal and motive which will make the work easier and achieve the set goal easily." },

  { q: "Which Fayol principle indicates that a company should work unitedly towards the interest of the company rather than personal interest?", options: ["Unity of Direction", "Equity", "Subordination of Individual Interest", "Centralization"], a: 2, e: "Subordination of Individual Interest: A company should work unitedly towards the interest of a company rather than personal interest." },

  { q: "According to Fayol, remuneration can be:", options: ["Only monetary", "Only non-monetary", "Monetary or non-monetary", "Based only on seniority"], a: 2, e: "Remuneration can be monetary or non-monetary. Ideally, it should be according to an individual's efforts they have put forth." },

  { q: "Fayol's principle of Scalar Chain states that hierarchy steps should be from:", options: ["Bottom to top", "Top to lowest", "Middle to top", "Lateral across departments"], a: 1, e: "Scalar Chain: The hierarchy steps should be from the top to the lowest. This is necessary so that every employee knows their immediate senior." },

  { q: "Which Fayol principle states that all employees should be treated equally and respectfully?", options: ["Order", "Equity", "Stability", "Initiative"], a: 1, e: "Equity: All employees should be treated equally and respectfully. It's the responsibility of a manager that no employees face discrimination." },

  { q: "Which Fayol principle relates to job security for employees?", options: ["Initiative", "Equity", "Stability", "Esprit de Corps"], a: 2, e: "Stability: An employee delivers the best if they feel secure in their job. It is the duty of the management to offer job security to their employees." },

  { q: "Which Fayol principle promotes team spirit and mutual understanding among employees?", options: ["Unity of Direction", "Initiative", "Esprit de Corps", "Scalar Chain"], a: 2, e: "Esprit de Corps: It is the responsibility of the management to motivate their employees and be supportive of each other regularly. Developing trust and mutual understanding will lead to a positive outcome." },

  { q: "Which Fayol principle states that management should encourage employees to take initiatives in an organization?", options: ["Stability", "Initiative", "Equity", "Esprit de Corps"], a: 1, e: "Initiative: The management should support and encourage the employees to take initiatives in an organisation. It will help them to increase their motivation and morale." },

  { q: "Which Fayol principle emphasizes a balance between hierarchy and division of power?", options: ["Scalar Chain", "Centralization", "Unity of Command", "Order"], a: 1, e: "Centralization: Henri Fayol stressed on the point that there should be a balance between the hierarchy and division of power." },

  { q: "Which Fayol principle states that a company should maintain a well-defined work order for a favorable work culture?", options: ["Equity", "Stability", "Order", "Centralization"], a: 2, e: "Order: A company should maintain a well-defined work order to have a favourable work culture. The positive atmosphere in the workplace will boost more positive productivity." },

  { q: "How many levels of management are described in the learning material?", options: ["Two", "Three", "Four", "Five"], a: 1, e: "There are three levels of management: Top Level Management, Middle Level Management, and Lower Level Management." },

  { q: "Which level of management is responsible for the survival and welfare of the organization?", options: ["Middle Level", "Lower Level", "Top Level", "Supervisory Level"], a: 2, e: "The managers at the top level of management of an organization are responsible for its survival and welfare." },

  { q: "Which level of management serves as a link between Top Level and Lower Level Management?", options: ["Strategic Level", "Middle Level", "Operational Level", "Supervisory Level"], a: 1, e: "The Middle Level serves as a link between the Top Level Management and the Lower Level Management." },

  { q: "Lower Level Management is also known as:", options: ["Strategic Management", "Middle Management", "Supervisory or Operational Level Management", "Executive Level Management"], a: 2, e: "The lower level management is also known as the Supervisory or Operational Level Management." },

  { q: "Which of the following is a function of Lower Level Management?", options: ["Setting company-wide financial policies", "Formulating company vision", "Issuing orders and instructions to workers", "Approving mergers and acquisitions"], a: 2, e: "Operational managers give clear instructions to workers and supervisors about their tasks, responsibilities, and authority, while also overseeing their work." },

  { q: "Which function of Lower Level Management involves listening to workers' issues and reporting them to middle-level managers?", options: ["Encouraging Employee Initiative", "Assigning and Assisting in Work", "Representing Workers' Grievances", "Preparation of Plan for Activities"], a: 2, e: "Lower level managers listen to workers' issues and report them to middle-level managers (Representing Workers' Grievances)." },

  { q: "Self-management is best defined as:", options: ["Managing a team of employees", "The conscious practice of directing your own behaviors, thoughts, and emotions to achieve goals", "The process of hiring and training staff", "Managing an organization's resources"], a: 1, e: "Self-management is the conscious and intentional practice of directing your own behaviors, thoughts, and emotions to achieve personal and professional goals." },

  { q: "Which self-management skill is described as like having an internal compass that guides toward goals?", options: ["Self-discipline", "Self-motivation", "Self-awareness", "Goal Setting"], a: 2, e: "Self-awareness is essentially like having an internal compass that guides us toward our goals and helps us make choices aligned with our authentic selves." },

  { q: "Self-discipline in self-management allows us to:", options: ["Set unrealistic goals", "Resist temptations and stay focused on priorities", "Avoid all forms of stress", "Multitask more efficiently"], a: 1, e: "Self-discipline is the ability to control our impulses and actions in pursuit of our goals. It allows us to resist temptations, stay focused on our priorities, and follow through on our commitments." },

  { q: "Which type of motivation comes from within and is driven by personal interest or satisfaction?", options: ["Extrinsic motivation", "Values-based motivation", "External motivation", "Intrinsic motivation"], a: 3, e: "Intrinsic motivation comes from within and is driven by personal interest, enjoyment, or a sense of satisfaction in the activity itself." },

  { q: "Which type of motivation comes from external sources such as rewards, praise, or recognition?", options: ["Intrinsic motivation", "Extrinsic motivation", "Values-based motivation", "Internal motivation"], a: 1, e: "Extrinsic motivation comes from external sources, such as rewards, praise, or recognition." },

  { q: "What does the 'S' in SMART goal setting stand for?", options: ["Sustainable", "Sufficient", "Specific", "Strategic"], a: 2, e: "SMART stands for Specific, Measurable, Achievable, Relevant, Time-bound. The 'S' stands for Specific: Clearly define your goal, avoiding vague or general statements." },

  { q: "What does the 'M' in SMART goals stand for?", options: ["Motivating", "Manageable", "Measurable", "Meaningful"], a: 2, e: "The 'M' in SMART stands for Measurable: Establish criteria to track your progress." },

  { q: "What does the 'A' in SMART goals stand for?", options: ["Ambitious", "Achievable", "Adaptive", "Analytical"], a: 1, e: "The 'A' in SMART stands for Achievable: Confirm your goal is realistic and attainable within your resources and timeframe." },

  { q: "What does the 'R' in SMART goals stand for?", options: ["Realistic", "Relevant", "Resourceful", "Rewarding"], a: 1, e: "The 'R' in SMART stands for Relevant: Align your goal with your overall values and objectives." },

  { q: "What does the 'T' in SMART goals stand for?", options: ["Trackable", "Transparent", "Time-bound", "Tactical"], a: 2, e: "The 'T' in SMART stands for Time-bound: Set a deadline for achieving your goal." },

  { q: "According to the material, when it comes to time management, what is described as your 'greatest enemy'?", options: ["Multitasking", "Procrastination", "Poor planning", "Lack of goals"], a: 1, e: "When it comes to time management, procrastination is your greatest enemy. Instead of dragging your feet, break down large tasks into smaller, more manageable steps." },

  { q: "Which self-management skill involves developing healthy coping mechanisms rather than eliminating stress completely?", options: ["Decision-making", "Time management", "Stress management", "Work-life balance"], a: 2, e: "Stress management is developing healthy coping mechanisms to navigate its challenges. It's not about eliminating stress altogether." },

  { q: "Work-life balance is best defined as:", options: ["Working extra hours for career growth", "The equilibrium between professional responsibilities and personal life", "Focusing only on professional tasks", "Spending more time on leisure than work"], a: 1, e: "Work-life balance is the equilibrium between professional responsibilities and personal life. It ensures individuals allocate adequate time for work, family, health, and leisure activities." },

  { q: "What does research suggest about excessive multitasking?", options: ["It significantly increases productivity", "It improves accuracy in complex tasks", "It can decrease efficiency and increase mental fatigue", "It enhances focus and decision-making"], a: 2, e: "Research suggests that excessive multitasking can decrease efficiency and increase mental fatigue." },

  { q: "Which self-management skill involves setting boundaries and disconnecting from work outside office hours?", options: ["Stress Management", "Time Management", "Self-Discipline", "Work-Life Balance"], a: 3, e: "Work-Life Balance involves setting boundaries and managing time effectively. Employees should also learn to disconnect from work outside office hours." },

  { q: "Which managerial skill involves reaching mutually beneficial agreements through discussion and compromise?", options: ["Team Management", "Conflict Resolution", "Negotiation Skills", "Leadership"], a: 2, e: "Negotiation skills involve reaching mutually beneficial agreements through discussion and compromise." },

  { q: "Which managerial skill is described as the ability to lead, coordinate, and motivate a group to achieve common goals?", options: ["Negotiation Skills", "Team Management", "Conflict Resolution", "Feedback"], a: 1, e: "Team management is the ability to lead, coordinate, and motivate a group to achieve common goals." },

  { q: "Which managerial skill involves handling and resolving disputes in a fair and constructive manner?", options: ["Team Management", "Leadership", "Feedback", "Conflict Resolution"], a: 3, e: "Conflict resolution is the ability to handle and resolve disputes in a fair and constructive manner." },

  { q: "What is the most effective technique in conflict resolution according to the material?", options: ["Avoidance", "Active listening, mediation, and compromise", "Imposing decisions on parties", "Ignoring the conflict"], a: 1, e: "Techniques of conflict resolution include active listening, mediation, and compromise. Resolving conflicts quickly prevents workplace tension and improves team dynamics." },

  { q: "Constructive feedback should be:", options: ["General and vague", "Negative and discouraging", "Specific, timely, and solution-focused", "Avoided in professional settings"], a: 2, e: "Constructive feedback should be specific, timely, and solution-focused. Positive reinforcement boosts motivation, while constructive criticism helps employees learn and grow." },

  { q: "Which managerial skill involves the ability to inspire, guide, and influence others to achieve goals?", options: ["Negotiation Skills", "Feedback", "Conflict Resolution", "Leadership"], a: 3, e: "Leadership is the ability to inspire, guide, and influence others to achieve goals. Great leaders set a vision, lead by example, and empower their teams." },

  { q: "Key leadership qualities include which of the following?", options: ["Avoidance of conflict", "Decision-making, communication, adaptability, and emotional intelligence", "Strict adherence to rules without flexibility", "Working independently without team input"], a: 1, e: "Key leadership qualities include decision-making, communication, adaptability, and emotional intelligence." },

        let currentIdx = 0, score = 0, answered = false;

        function startQuiz() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            
            const totalQuestions = questions.length;
            document.getElementById('progress-text').innerText = `Question 1/${totalQuestions}`;
            document.getElementById('final-total').innerText = `Correct out of ${totalQuestions}`;
            
            // Randomize options for each question initially
            questions.forEach(q => {
                const originalCorrect = q.options[q.a];
                
                // Fisher-Yates shuffle for options
                for (let i = q.options.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [q.options[i], q.options[j]] = [q.options[j], q.options[i]];
                }
                
                // Find new index of the correct answer
                q.a = q.options.indexOf(originalCorrect);
            });

            loadQuestion();
        }

        function loadQuestion() {
            const q = questions[currentIdx];
            const totalQuestions = questions.length;
            
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('progress-text').innerText = `Question ${currentIdx + 1}/${totalQuestions}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / totalQuestions) * 100}%`;
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-2xl border-2 border-slate-100 hover:border-amber-400 hover:bg-amber-50 font-medium text-sm text-slate-700 transition-all";
                btn.innerText = opt;
                btn.onclick = () => selectOption(i, btn);
                container.appendChild(btn);
            });
            
            document.getElementById('explanation-box').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');
            answered = false;
        }

        function selectOption(idx, btn) {
            if (answered) return;
            answered = true;
            
            const q = questions[currentIdx];
            const allBtns = document.querySelectorAll('#options-container button');
            
            if (idx === q.a) {
                score++;
                btn.classList.add('border-green-500', 'bg-green-50', 'text-green-700');
                document.getElementById('score-text').innerText = `Score: ${score}`;
            } else {
                btn.classList.add('border-red-500', 'bg-red-50', 'text-red-700');
                allBtns[q.a].classList.add('border-green-500', 'bg-green-50', 'text-green-700');
            }
            
            const exp = document.getElementById('explanation-box');
            exp.innerHTML = `<strong>Explanation:</strong> ${q.e}`;
            exp.classList.remove('hidden');
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            if (currentIdx < questions.length - 1) {
                currentIdx++;
                loadQuestion();
            } else {
                document.getElementById('quiz-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.remove('hidden');
                document.getElementById('final-score').innerText = score;
            }
        }
    </script>
