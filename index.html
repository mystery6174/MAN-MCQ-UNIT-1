    <script>
        // Note: The correct answer is at index 0 in the source, but the JavaScript shuffles them randomly at runtime!
        const questions = [
            // 1-25: Definitions, Concepts, and Nature of Management
            { q: "Who defined management as 'the art of getting things done through others'?", options: ["Mary Parker Follett", "F.W. Taylor", "Henry Fayol", "Peter Drucker"], a: 0, e: "Mary Parker Follett gave the most traditional and widely accepted definition of management." },
            { q: "Which of the following best describes 'Management'?", options: ["It is a continuous, dynamic, and goal-oriented process", "It is only required in business organizations", "It is a static process", "It only deals with machines"], a: 0, e: "Management is an ongoing, continuous process aimed at achieving organizational goals efficiently and effectively." },
            { q: "Management is essential for:", options: ["All types of organizations (Profit, Non-profit, Service, Manufacturing)", "Only profit-making organizations", "Only large manufacturing industries", "Only government organizations"], a: 0, e: "Management is a universal concept applicable to all types of organizations, regardless of size or nature." },
            { q: "Which of the following is NOT a characteristic of Management?", options: ["It is an isolated, one-time activity", "It is an intangible force", "It is multidimensional", "It is a group activity"], a: 0, e: "Management is a continuous, never-ending process, not a one-time isolated activity." },
            { q: "Why is management considered an 'Intangible Force'?", options: ["Because its presence can be felt by the results of the organization, but it cannot be seen or touched", "Because managers do not do physical work", "Because it relies on invisible software", "Because it is a hypothetical concept"], a: 0, e: "Management cannot be seen, but its effectiveness is visible in the form of order, productivity, and goal achievement." },
            { q: "Management is considered to be both an Art and a Science. Why?", options: ["It has a systematized body of knowledge (Science) and requires personalized application/skills (Art)", "It uses chemicals (Science) and drawing (Art)", "It relies entirely on mathematics", "It is only based on gut feelings"], a: 0, e: "Like science, it has theoretical principles. Like art, it requires creative and personalized application of those principles." },
            { q: "Who defined management as 'to manage is to forecast and to plan, to organize, to command, to coordinate and to control'?", options: ["Henry Fayol", "F.W. Taylor", "Luther Gulick", "Max Weber"], a: 0, e: "This is Henry Fayol's classic definition outlining the core functions of management." },
            { q: "Effectiveness in management means:", options: ["Doing the right things to achieve the goal on time", "Doing things at the lowest possible cost", "Working without taking breaks", "Reducing the number of employees"], a: 0, e: "Effectiveness is concerned with the end result (achieving the goal), while efficiency is about doing it with minimum resources." },
            { q: "Efficiency in management means:", options: ["Doing things correctly and at the minimum possible cost", "Achieving the goal regardless of the cost", "Maximizing employee working hours", "Producing the maximum number of defective goods"], a: 0, e: "Efficiency focuses on the cost-benefit analysis and optimizing resource utilization." },
            { q: "Which characteristic states that management principles are applicable globally?", options: ["Pervasive / Universal", "Goal-Oriented", "Continuous Process", "Multidimensional"], a: 0, e: "Management is pervasive, meaning it is required in every organization across the globe." },
            { q: "Management is a 'Multidimensional' concept because it involves:", options: ["Management of work, people, and operations", "Management of cash, machines, and buildings", "Management of suppliers, customers, and government", "Management of software, hardware, and networks"], a: 0, e: "It breaks down into managing the work to be done, the people doing it, and the operations producing the output." },
            { q: "The primary objective of management is to:", options: ["Achieve organizational goals efficiently and effectively", "Only maximize the owner's wealth", "Create conflicts among employees", "Delay decision-making"], a: 0, e: "The ultimate aim is fulfilling the purpose for which the organization was established." },
            { q: "Management is a 'Dynamic Function'. This means:", options: ["It adapts to changes in the external environment (social, economic, political)", "It is strictly rigid and never changes", "It moves physically from one place to another", "It only changes when a new manager is hired"], a: 0, e: "A successful organization must constantly adapt its management practices to survive changing external environments." },
            { q: "Which of the following proves that management is a 'Profession'?", options: ["It requires specialized knowledge, formal education, and a code of conduct", "Anyone can become a manager without any skills", "It is based solely on inheritance", "It requires no formal training"], a: 0, e: "While not as strict as medicine or law, management increasingly demands formal degrees (like an MBA) and ethical standards." },
            { q: "The phrase 'Management is what a manager does' was coined by:", options: ["Louis Allen", "Peter Drucker", "Henry Fayol", "F.W. Taylor"], a: 0, e: "Louis Allen provided a functional definition of management." },
            { q: "Who is known as the 'Father of Modern Management'?", options: ["Henry Fayol", "F.W. Taylor", "Elton Mayo", "Max Weber"], a: 0, e: "Henry Fayol is credited with the administrative management theory and his 14 principles are the foundation of modern management." },
            { q: "Who is known as the 'Father of Scientific Management'?", options: ["F.W. Taylor", "Henry Fayol", "Mary Parker Follett", "Frank Gilbreth"], a: 0, e: "Frederick Winslow Taylor pioneered the scientific approach to maximize industrial efficiency." },
            { q: "According to Peter Drucker, what is the core task of management?", options: ["Innovation and Marketing", "Accounting and Finance", "Hiring and Firing", "Manufacturing and Maintenance"], a: 0, e: "Drucker famously stated that because the purpose of business is to create a customer, the business enterprise has two basic functions: marketing and innovation." },
            { q: "Which feature implies that management integrates the efforts of all members towards a common goal?", options: ["It is a Group Activity", "It is Intangible", "It is Continuous", "It is a Science"], a: 0, e: "An organization consists of diverse individuals. Management unites their efforts in a common direction." },
            { q: "Management is a system of:", options: ["Authority and responsibility", "Computers and networks", "Machines and tools", "Laws and regulations"], a: 0, e: "Management establishes a hierarchy of authority and delegates responsibilities to get work done." },
            { q: "Which of the following is NOT an organizational objective of management?", options: ["Providing free education to the public", "Survival of the business", "Earning profit", "Growth and expansion"], a: 0, e: "Free education is a social objective, whereas survival, profit, and growth are purely organizational/economic objectives." },
            { q: "Which of the following is a 'Social Objective' of management?", options: ["Generating employment opportunities for the community", "Maximizing shareholder wealth", "Increasing market share", "Reducing production costs"], a: 0, e: "Social objectives fulfill the organization's obligation to the society in which it operates." },
            { q: "Which of the following is a 'Personal/Human Objective' of management?", options: ["Providing fair wages, good working conditions, and growth opportunities to employees", "Using eco-friendly methods of production", "Maximizing profits", "Defeating competitors"], a: 0, e: "Personal objectives relate to the well-being and satisfaction of the organization's workforce." },
            { q: "The term 'POSDCORB' is associated with the functions of management. Who coined it?", options: ["Luther Gulick", "Henry Fayol", "F.W. Taylor", "Peter Drucker"], a: 0, e: "Luther Gulick coined the acronym POSDCORB to summarize the duties of a chief executive." },
            { q: "What does 'POSDCORB' stand for?", options: ["Planning, Organizing, Staffing, Directing, Coordinating, Reporting, Budgeting", "Planning, Operating, Supervising, Directing, Controlling, Reporting, Buying", "Producing, Organizing, Staffing, Delivering, Controlling, Recording, Budgeting", "Planning, Organizing, Staffing, Directing, Controlling, Rating, Billing"], a: 0, e: "It is a classic acronym defining the fundamental functions of management and administration." },

            // 26-50: Levels of Management & Managerial Skills
            { q: "How many primary levels of management exist in a typical formal organization?", options: ["Three (Top, Middle, Lower)", "Two (Top, Bottom)", "Four (Top, Upper-Middle, Lower-Middle, Bottom)", "Five"], a: 0, e: "The standard pyramid consists of Top, Middle, and Lower (Supervisory) levels." },
            { q: "The Board of Directors, Chief Executive Officer (CEO), and Managing Director belong to which level of management?", options: ["Top Level", "Middle Level", "Lower Level", "Operational Level"], a: 0, e: "Top-level management consists of the senior-most executives responsible for overall direction." },
            { q: "Which level of management is primarily responsible for formulating the overall organizational goals, policies, and strategies?", options: ["Top Level", "Middle Level", "Lower/Supervisory Level", "Non-managerial staff"], a: 0, e: "Strategic planning and long-term goal setting are the primary duties of Top Management." },
            { q: "Departmental Heads, Branch Managers, and Production Managers typically belong to which level?", options: ["Middle Level", "Top Level", "Supervisory Level", "Shop-floor Level"], a: 0, e: "Middle management acts as a link between top and lower levels, heading specific departments." },
            { q: "Which level of management is responsible for interpreting and explaining the policies framed by top management?", options: ["Middle Level", "Top Level", "Lower Level", "Workers"], a: 0, e: "Middle managers translate strategic plans into actionable tasks for the lower levels." },
            { q: "Supervisors, Foremen, and Section Officers fall under which level of management?", options: ["Lower / Operational Level", "Middle Level", "Top Level", "Executive Level"], a: 0, e: "Lower-level managers directly oversee the actual workforce (workers) and daily operations." },
            { q: "Which level of management directly interacts with the actual workforce/laborers?", options: ["Lower Level", "Middle Level", "Top Level", "Board of Directors"], a: 0, e: "Lower-level management serves as the direct link between the management hierarchy and the non-managerial workers." },
            { q: "What is the primary focus of Lower-level management?", options: ["Ensuring quality, minimizing wastage, and maintaining discipline among workers", "Formulating long-term business strategies", "Interacting with government authorities and media", "Deciding the company's dividend policy"], a: 0, e: "They are focused on day-to-day execution, quality control, and shop-floor discipline." },
            { q: "According to Robert Katz, what are the three basic types of managerial skills?", options: ["Conceptual, Human (Interpersonal), and Technical", "Planning, Directing, and Controlling", "Financial, Marketing, and Operational", "Speaking, Writing, and Listening"], a: 0, e: "Katz identified these three critical skill sets required by managers at all levels." },
            { q: "Which managerial skill involves the ability to see the organization as a whole and understand how its parts depend on each other?", options: ["Conceptual Skills", "Technical Skills", "Human Skills", "Mechanical Skills"], a: 0, e: "Conceptual skills are the mental abilities to analyze complex situations and think strategically." },
            { q: "Conceptual skills are most critical for which level of management?", options: ["Top Level", "Middle Level", "Lower Level", "Workers"], a: 0, e: "Top managers need conceptual skills to navigate long-term planning and complex business environments." },
            { q: "Which skill involves the ability to work effectively with, understand, and motivate other people?", options: ["Human / Interpersonal Skills", "Technical Skills", "Conceptual Skills", "Analytical Skills"], a: 0, e: "Human skills are vital for communication, team building, and leadership." },
            { q: "Human/Interpersonal skills are equally important for which level(s) of management?", options: ["All levels (Top, Middle, Lower)", "Only Top Level", "Only Lower Level", "Only Middle Level"], a: 0, e: "Because every manager must interact with people, human skills are universally essential across all levels." },
            { q: "Which skill involves knowledge of and proficiency in a specific specialized field or activity (like coding, accounting, or operating machinery)?", options: ["Technical Skills", "Conceptual Skills", "Human Skills", "Design Skills"], a: 0, e: "Technical skills relate to the actual mechanics and processes of the work being done." },
            { q: "Technical skills are most critical for which level of management?", options: ["Lower / Supervisory Level", "Top Level", "Middle Level", "Board of Directors"], a: 0, e: "Supervisors must know how to do the actual work so they can train, guide, and evaluate the workers." },
            { q: "As a manager moves from the lower level to the top level, the need for which skill decreases?", options: ["Technical Skills", "Conceptual Skills", "Human Skills", "Communication Skills"], a: 0, e: "A CEO doesn't need to know how to operate the factory machinery, but a foreman does." },
            { q: "Who acts as a 'Linking Pin' between the top management and lower management?", options: ["Middle Management", "Workers", "Customers", "Supervisors"], a: 0, e: "Middle management receives orders from the top and passes instructions down to the lower level." },
            { q: "Who acts as a 'Linking Pin' between the management and the workers?", options: ["Lower / Supervisory Management", "Middle Management", "Top Management", "Trade Unions"], a: 0, e: "Supervisors communicate worker grievances up to management and management instructions down to workers." },
            { q: "Maintaining relations with the outside world (government, media, investors) is primarily the job of:", options: ["Top Management", "Middle Management", "Lower Management", "Clerks"], a: 0, e: "Top-level executives act as the public face and legal representatives of the organization." },
            { q: "Assigning duties and responsibilities to personnel within their specific department is a function of:", options: ["Middle Management", "Top Management", "Lower Management", "Shareholders"], a: 0, e: "Department heads (Middle level) are responsible for organizing their specific units." },
            { q: "Which level of management spends the most time on 'Planning' and 'Organizing' functions?", options: ["Top Management", "Middle Management", "Lower Management", "Workers"], a: 0, e: "Top management focuses heavily on setting the vision and structuring the organization." },
            { q: "Which level of management spends the most time on 'Directing' and 'Controlling' daily operations?", options: ["Lower Management", "Top Management", "Middle Management", "Shareholders"], a: 0, e: "Supervisors spend their time guiding workers (Directing) and checking their immediate output (Controlling)." },
            { q: "What is a 'First-Line Manager'?", options: ["Another name for Lower/Supervisory level management", "The CEO of the company", "A department head", "A member of the Board of Directors"], a: 0, e: "First-line managers are the first level of management above the non-managerial workforce." },
            { q: "An individual working on the assembly line producing goods belongs to which level of the organization?", options: ["Non-managerial level / Workforce", "Lower Level Management", "Middle Level Management", "Top Level Management"], a: 0, e: "Workers have no subordinates; they are purely operational and do not belong to the management hierarchy." },
            { q: "Which management level is responsible for ensuring safe working conditions on the factory floor?", options: ["Lower / Supervisory Management", "Top Management", "Middle Management", "Investors"], a: 0, e: "Foremen and supervisors are physically present on the floor and are directly responsible for worker safety." },

            // 51-75: Administration vs Management & Managerial Roles
            { q: "What is the primary difference between Administration and Management according to the traditional view?", options: ["Administration determines the objectives and policies, while Management executes them", "Management determines policies, Administration executes them", "Administration is for low-level workers, Management is for CEOs", "There is no difference at all"], a: 0, e: "Administration is determinative (thinking), while Management is executive (doing)." },
            { q: "Administration is primarily concerned with:", options: ["Formulation of broad objectives, plans, and policies", "Executing the policies", "Day-to-day operations", "Supervising workers"], a: 0, e: "Administration sets the ultimate boundaries and goals of the enterprise." },
            { q: "Management is primarily concerned with:", options: ["Directing human efforts to execute the plans framed by administration", "Setting the ultimate goals of the company", "Providing capital for the business", "Distributing dividends"], a: 0, e: "Management translates the administration's vision into actual results." },
            { q: "According to Oliver Sheldon, Administration is a function of:", options: ["Top-level executives and owners", "Lower-level supervisors", "Middle-level managers", "Non-managerial staff"], a: 0, e: "Administration is done by the Board of Directors and owners." },
            { q: "Which of the following sectors traditionally uses the term 'Administration' rather than 'Management'?", options: ["Government, military, and non-profit institutions", "Corporate businesses", "Tech startups", "Manufacturing factories"], a: 0, e: "We typically refer to 'Public Administration' or 'Hospital Administration', but 'Business Management'." },
            { q: "In a corporate setting, who represents 'Administration'?", options: ["The Board of Directors and Shareholders", "The Branch Managers", "The Foremen", "The Clerks"], a: 0, e: "The owners and the board set the absolute top-level policies, acting as administrators." },
            { q: "In modern business terminology, the terms 'Administration' and 'Management' are:", options: ["Often used interchangeably", "Completely unrelated concepts", "Enemies of each other", "Used only in factories"], a: 0, e: "Modern theorists often treat them as the same process, where every manager performs both administrative and executive functions." },
            { q: "Henry Mintzberg identified how many distinct roles that managers play?", options: ["10 roles, grouped into 3 categories", "14 roles", "5 roles", "3 roles, grouped into 10 categories"], a: 0, e: "Mintzberg grouped 10 roles into Interpersonal, Informational, and Decisional categories." },
            { q: "According to Mintzberg, which category involves roles related to interacting with people and providing direction?", options: ["Interpersonal Roles", "Informational Roles", "Decisional Roles", "Technical Roles"], a: 0, e: "Interpersonal roles include Figurehead, Leader, and Liaison." },
            { q: "When a manager performs ceremonial duties, like greeting visiting dignitaries or attending an employee's wedding, they are acting in which role?", options: ["Figurehead", "Liaison", "Monitor", "Entrepreneur"], a: 0, e: "The Figurehead role involves symbolic and ceremonial duties." },
            { q: "When a manager motivates, inspires, and directs subordinates, they are playing the role of a:", options: ["Leader", "Spokesperson", "Disseminator", "Negotiator"], a: 0, e: "The Leader role is central to interacting with and guiding subordinates." },
            { q: "Which role involves networking and maintaining contacts outside the manager's immediate vertical chain of command?", options: ["Liaison", "Monitor", "Resource Allocator", "Figurehead"], a: 0, e: "The Liaison establishes internal and external webs of contacts for information exchange." },
            { q: "According to Mintzberg, roles involving receiving, collecting, and disseminating data fall under which category?", options: ["Informational Roles", "Interpersonal Roles", "Decisional Roles", "Conceptual Roles"], a: 0, e: "Informational roles include Monitor, Disseminator, and Spokesperson." },
            { q: "When a manager constantly scans the environment for information to understand the organization's current state, they act as a:", options: ["Monitor", "Disseminator", "Entrepreneur", "Disturbance Handler"], a: 0, e: "The Monitor seeks out information (reports, gossip, news) to stay informed." },
            { q: "When a manager shares collected information with their subordinates, they are performing the role of a:", options: ["Disseminator", "Spokesperson", "Leader", "Negotiator"], a: 0, e: "The Disseminator passes privileged information down to employees." },
            { q: "When a manager represents the organization to outsiders (e.g., giving a press conference), they act as a:", options: ["Spokesperson", "Figurehead", "Monitor", "Resource Allocator"], a: 0, e: "The Spokesperson transmits information to people outside the organization." },
            { q: "According to Mintzberg, roles that involve making choices and taking action are called:", options: ["Decisional Roles", "Informational Roles", "Interpersonal Roles", "Functional Roles"], a: 0, e: "Decisional roles include Entrepreneur, Disturbance Handler, Resource Allocator, and Negotiator." },
            { q: "When a manager initiates a new project to improve departmental performance, they are acting as an:", options: ["Entrepreneur", "Liaison", "Disseminator", "Figurehead"], a: 0, e: "The Entrepreneur role involves driving change, innovation, and adapting to the environment." },
            { q: "If a sudden strike or supply chain breakdown occurs, the manager must act as a:", options: ["Disturbance Handler", "Spokesperson", "Leader", "Resource Allocator"], a: 0, e: "The Disturbance Handler takes corrective action during unexpected crises or conflicts." },
            { q: "When a manager decides which department gets a larger budget or more staff, they are acting as a:", options: ["Resource Allocator", "Monitor", "Entrepreneur", "Liaison"], a: 0, e: "The Resource Allocator decides who gets what (time, money, equipment, personnel)." },
            { q: "When a manager discusses terms with a supplier or a labor union, they are performing the role of a:", options: ["Negotiator", "Spokesperson", "Figurehead", "Monitor"], a: 0, e: "The Negotiator represents the organization in major negotiations." },
            { q: "Which of the following is NOT one of Mintzberg's Decisional Roles?", options: ["Leader", "Entrepreneur", "Disturbance Handler", "Negotiator"], a: 0, e: "Leader is an Interpersonal role, not a Decisional role." },
            { q: "Which of the following is NOT one of Mintzberg's Informational Roles?", options: ["Liaison", "Monitor", "Disseminator", "Spokesperson"], a: 0, e: "Liaison is an Interpersonal role." },
            { q: "A factory supervisor resolving a fight between two workers is primarily executing which role?", options: ["Disturbance Handler", "Resource Allocator", "Figurehead", "Spokesperson"], a: 0, e: "Resolving unexpected conflicts is the core of the Disturbance Handler role." },
            { q: "A CEO allocating millions of dollars for a new R&D facility is playing the role of:", options: ["Resource Allocator", "Monitor", "Liaison", "Disseminator"], a: 0, e: "They are making a massive decision about where to apply financial resources." },

            // 76-100: Functions of Management (Planning, Organizing, Staffing, Directing, Controlling)
            { q: "What is considered the primary, most fundamental function of management?", options: ["Planning", "Organizing", "Staffing", "Controlling"], a: 0, e: "Planning is the first function; all other functions (organizing, staffing) depend on the plan." },
            { q: "Which function of management involves 'deciding in advance what to do, how to do it, when to do it, and who is to do it'?", options: ["Planning", "Controlling", "Directing", "Organizing"], a: 0, e: "Planning bridges the gap from where we are to where we want to go." },
            { q: "Which management function creates a structure of roles and responsibilities?", options: ["Organizing", "Planning", "Staffing", "Directing"], a: 0, e: "Organizing involves grouping tasks, establishing authority, and allocating resources." },
            { q: "What is the primary objective of the 'Organizing' function?", options: ["To establish a harmonious relationship between human and physical resources to achieve goals", "To recruit employees", "To check if the work is done correctly", "To formulate the business vision"], a: 0, e: "Organizing brings order to the chaos by assigning specific jobs to specific people." },
            { q: "Which function is known as the 'Human Resource' function of management?", options: ["Staffing", "Organizing", "Planning", "Controlling"], a: 0, e: "Staffing deals entirely with the human element of the enterprise." },
            { q: "What does the 'Staffing' function involve?", options: ["Recruitment, selection, training, placement, and remuneration of personnel", "Buying raw materials", "Assigning daily targets", "Comparing actual performance with standards"], a: 0, e: "Staffing ensures that the right person is put on the right job." },
            { q: "Which function initiates actual action in the organization?", options: ["Directing", "Planning", "Organizing", "Staffing"], a: 0, e: "While planning and organizing are preparatory, Directing actually sets the work in motion." },
            { q: "What are the core elements of the 'Directing' function?", options: ["Supervision, Motivation, Leadership, and Communication", "Recruitment, Selection, and Training", "Budgeting and Accounting", "Standard setting and Measurement"], a: 0, e: "Directing involves guiding and inspiring subordinates to achieve goals." },
            { q: "Which element of Directing involves inspiring subordinates to work with zeal and enthusiasm?", options: ["Motivation", "Supervision", "Communication", "Leadership"], a: 0, e: "Motivation provides the psychological drive for employees to perform at their best." },
            { q: "Which element of Directing involves influencing the behavior of people to willingly work towards goals?", options: ["Leadership", "Communication", "Supervision", "Staffing"], a: 0, e: "Leadership is the ability to influence a group toward the achievement of a vision." },
            { q: "Which function of management involves comparing actual performance with planned performance?", options: ["Controlling", "Directing", "Organizing", "Planning"], a: 0, e: "Controlling ensures that everything occurs in conformity with the plans adopted." },
            { q: "What is the first step in the 'Controlling' process?", options: ["Establishing standards of performance", "Measuring actual performance", "Comparing actual against standard", "Taking corrective action"], a: 0, e: "You cannot control or measure performance unless you first establish a target (standard)." },
            { q: "What is the final step in the 'Controlling' process?", options: ["Taking corrective action", "Measuring performance", "Setting standards", "Analyzing deviations"], a: 0, e: "If deviations are found, the manager must take corrective action to get back on track." },
            { q: "It is often said that 'Planning is looking ahead, while Controlling is:'", options: ["Looking back", "Looking sideways", "Moving forward", "Standing still"], a: 0, e: "Controlling evaluates past actions to see if they met the planned future goals." },
            { q: "Why are Planning and Controlling considered 'inseparable twins' of management?", options: ["Because planning provides the standards for controlling, and controlling improves future planning", "Because they are done by the exact same manager", "Because they take the same amount of time", "Because they were invented by the same person"], a: 0, e: "Without planning, there is nothing to control. Without control, plans are rarely achieved." },
            { q: "Which function of management is pervasive and required at all levels (Top, Middle, Lower)?", options: ["All functions (Planning, Organizing, Staffing, Directing, Controlling)", "Only Planning", "Only Directing", "Only Controlling"], a: 0, e: "Every manager, regardless of level, performs all these functions, just in different proportions." },
            { q: "Coordination is often considered:", options: ["The essence of management", "A separate 6th function of management", "Unnecessary in modern business", "Only required at the top level"], a: 0, e: "Coordination is not a separate function but the invisible thread that binds all functions together." },
            { q: "What is 'Coordination'?", options: ["Synchronizing and unifying the efforts of group members to achieve common objectives", "Forcing employees to work overtime", "Firing inefficient employees", "Creating new business plans"], a: 0, e: "Coordination ensures that different departments (like sales and production) work together smoothly." },
            { q: "A manager sets a target to produce 10,000 units this month. Which function does this represent?", options: ["Planning", "Organizing", "Directing", "Controlling"], a: 0, e: "Setting targets and objectives is the essence of Planning." },
            { q: "A manager notices production is at 8,000 units instead of the planned 10,000, and repairs a broken machine to fix it. Which function is this?", options: ["Controlling", "Staffing", "Planning", "Organizing"], a: 0, e: "Finding the deviation (2,000 units short) and taking corrective action is Controlling." },
            { q: "A manager decides to split the factory floor into a 'Cutting Department' and an 'Assembly Department'. Which function is this?", options: ["Organizing", "Staffing", "Directing", "Controlling"], a: 0, e: "Creating departments and structuring the workplace is Organizing." },
            { q: "A manager conducts interviews to hire 5 new engineers. Which function is this?", options: ["Staffing", "Directing", "Planning", "Controlling"], a: 0, e: "Recruitment and selection fall under Staffing." },
            { q: "A manager gives a pep talk and clearly explains the daily tasks to the workers. Which function is this?", options: ["Directing", "Organizing", "Staffing", "Controlling"], a: 0, e: "Motivating and instructing employees is Directing." },
            { q: "Which function bridges the gap between where we are and where we want to be?", options: ["Planning", "Organizing", "Staffing", "Directing"], a: 0, e: "Planning dictates the future course of action." },
            { q: "What happens if the 'Organizing' function is poor?", options: ["It leads to confusion, duplication of work, and overlapping of duties", "Production speed doubles", "Profits increase", "Staffing becomes unnecessary"], a: 0, e: "Without proper structure and clear authority, chaos ensues." },

            // 101-125: F.W. Taylor's Scientific Management
            { q: "Who is known as the 'Father of Scientific Management'?", options: ["Frederick Winslow Taylor", "Henry Fayol", "Elton Mayo", "Max Weber"], a: 0, e: "F.W. Taylor pioneered the systematic, scientific study of work processes." },
            { q: "What was F.W. Taylor's primary profession before becoming a management theorist?", options: ["Mechanical Engineer", "Psychologist", "Accountant", "Lawyer"], a: 0, e: "Taylor's engineering background led him to view management as an exact science." },
            { q: "What is the core philosophy of 'Scientific Management'?", options: ["Replacing rule-of-thumb and guesswork with scientific analysis of every aspect of a job", "Treating workers like family", "Focusing exclusively on marketing", "Letting workers decide how to work"], a: 0, e: "Taylor believed there was 'One Best Way' to do every job, which could be found through science." },
            { q: "Which principle of Taylor states that management should not rely on intuition or past habits?", options: ["Science, Not Rule of Thumb", "Harmony, Not Discord", "Cooperation, Not Individualism", "Maximum Output"], a: 0, e: "Taylor advocated for measuring and calculating exact methods instead of guessing (Rule of Thumb)." },
            { q: "Taylor's principle of 'Harmony, Not Discord' emphasizes:", options: ["A mental revolution where management and workers share mutual respect and work together peacefully", "Workers competing against each other", "Management forcing workers to obey", "Eliminating all supervisors"], a: 0, e: "Taylor believed that conflict between labor and management destroyed productivity." },
            { q: "What did Taylor mean by 'Mental Revolution'?", options: ["A complete change in the attitude of both management and workers toward each other from conflict to cooperation", "Workers reading more books", "Replacing humans with robots", "Management lowering wages"], a: 0, e: "He believed both sides needed to realize that their success was mutually dependent." },
            { q: "Taylor advocated for the 'Development of each and every person to his or her greatest efficiency'. This implies:", options: ["Scientific selection and rigorous training of workers", "Firing slow workers immediately", "Making everyone work 16 hours a day", "Paying everyone the exact same wage"], a: 0, e: "Workers should be scientifically selected for a job that suits them and trained to perfection." },
            { q: "Which of Taylor's techniques involves separating the planning function from the execution function on the shop floor?", options: ["Functional Foremanship", "Time Study", "Motion Study", "Differential Piece Wage System"], a: 0, e: "Taylor believed a single foreman could not be an expert in everything, so he separated planning from doing." },
            { q: "Under 'Functional Foremanship', how many specialized bosses supervise a single worker?", options: ["8 (4 for planning, 4 for execution)", "1", "4", "14"], a: 0, e: "Taylor proposed 8 specialized bosses (like speed boss, inspector, gang boss) to guide the worker." },
            { q: "Which technique of Scientific Management determines the standard time required to perform a well-defined job?", options: ["Time Study", "Motion Study", "Fatigue Study", "Method Study"], a: 0, e: "Time study uses stopwatches to calculate a fair day's work." },
            { q: "What is the purpose of 'Motion Study'?", options: ["To study the movements of a worker and eliminate unnecessary, wasteful motions to increase efficiency", "To measure how fast a machine moves", "To track attendance", "To calculate wages"], a: 0, e: "By eliminating useless movements, a job can be done much faster with less effort." },
            { q: "Which study under Scientific Management determines the amount and frequency of rest intervals required by workers?", options: ["Fatigue Study", "Time Study", "Method Study", "Motion Study"], a: 0, e: "Fatigue study ensures workers do not burn out, maintaining productivity over the whole shift." },
            { q: "What is the objective of 'Method Study'?", options: ["To find the 'one best way' of doing a job from raw material to final product", "To test different payment methods", "To study competitor methods", "To find the fastest worker"], a: 0, e: "Method study optimizes the entire production process layout." },
            { q: "Which technique involves standardizing the tools, equipment, materials, and working conditions?", options: ["Standardization and Simplification of Work", "Functional Foremanship", "Differential Wage System", "Fatigue Study"], a: 0, e: "Standardization ensures interchangeable parts and consistent quality." },
            { q: "What does 'Simplification' mean in Taylor's techniques?", options: ["Eliminating unnecessary varieties, sizes, and dimensions of products to save costs", "Making the product easier to use", "Hiring unskilled workers", "Removing supervisors"], a: 0, e: "Simplification reduces inventory costs and maximizes machinery use." },
            { q: "Which wage system did Taylor introduce to motivate workers to produce more?", options: ["Differential Piece Wage System", "Time-based Salary", "Equal Pay System", "Profit Sharing"], a: 0, e: "This system pays a higher rate per unit to efficient workers and a lower rate to inefficient ones." },
            { q: "Under the Differential Piece Wage System, a worker who produces more than the standard target is paid:", options: ["A higher piece rate", "A lower piece rate", "The standard piece rate", "A fixed monthly salary"], a: 0, e: "This creates a strong financial incentive to exceed the standard target." },
            { q: "Taylor's primary focus was on improving efficiency at which level of the organization?", options: ["Shop-floor / Lower Level", "Top Management Level", "Middle Management Level", "Board of Directors"], a: 0, e: "Scientific management is intensely focused on the physical execution of work at the factory level." },
            { q: "Which of the following is a criticism of Scientific Management?", options: ["It treats workers like machines and ignores human psychology and social needs", "It lowers production efficiency", "It relies too much on intuition", "It pays workers too much"], a: 0, e: "Critics argue Taylorism dehumanizes the workforce by breaking jobs into monotonous, repetitive tasks." },
            { q: "In Functional Foremanship, which boss is responsible for ensuring the work is completed on time?", options: ["Speed Boss", "Inspector", "Gang Boss", "Instruction Card Clerk"], a: 0, e: "The Speed Boss (Execution in-charge) ensures timely completion of the job." },
            { q: "In Functional Foremanship, which boss is responsible for keeping machines and tools ready for operation?", options: ["Gang Boss", "Repair Boss", "Inspector", "Route Clerk"], a: 0, e: "The Gang Boss ensures the physical setup is ready for the worker." },
            { q: "In Functional Foremanship, which boss checks the quality of the work done?", options: ["Inspector", "Speed Boss", "Disciplinarian", "Time and Cost Clerk"], a: 0, e: "The Inspector is responsible for quality control." },
            { q: "Which study aims to determine a 'Fair Day's Work'?", options: ["Time Study", "Fatigue Study", "Motion Study", "Method Study"], a: 0, e: "Time study defines exactly how much a normal worker should produce in one shift." },
            { q: "Taylor's insistence on separating planning from doing violates which of Henry Fayol's principles?", options: ["Unity of Command", "Equity", "Remuneration", "Order"], a: 0, e: "Functional foremanship gives a worker 8 bosses, directly violating Unity of Command (having only one boss)." },
            { q: "What was the name of F.W. Taylor's famous book published in 1911?", options: ["The Principles of Scientific Management", "General and Industrial Management", "The Practice of Management", "Wealth of Nations"], a: 0, e: "This book laid the foundation for industrial engineering and modern management efficiency." },

            // 126-150: Henry Fayol's 14 Principles of Management
            { q: "Who is known as the 'Father of General / Administrative Management'?", options: ["Henry Fayol", "F.W. Taylor", "Max Weber", "Elton Mayo"], a: 0, e: "Fayol provided a general theory of management applicable to all levels and types of organizations." },
            { q: "How many Principles of Management did Henry Fayol propose?", options: ["14", "10", "12", "8"], a: 0, e: "Fayol outlined 14 fundamental principles of management in his book." },
            { q: "Which of Fayol's principles states that work should be divided into small, specialized tasks to increase efficiency?", options: ["Division of Work", "Authority and Responsibility", "Order", "Initiative"], a: 0, e: "Division of work leads to specialization, which increases speed and accuracy." },
            { q: "According to Fayol, 'Authority' must always be accompanied by an equal amount of:", options: ["Responsibility", "Discipline", "Remuneration", "Centralization"], a: 0, e: "Authority without responsibility leads to abuse of power, while responsibility without authority causes frustration." },
            { q: "Which principle insists that employees must obey and respect the rules that govern the organization?", options: ["Discipline", "Order", "Equity", "Scalar Chain"], a: 0, e: "Discipline requires good supervisors, clear rules, and fair application of penalties." },
            { q: "Which principle dictates that an employee should receive orders from and be accountable to only ONE superior?", options: ["Unity of Command", "Unity of Direction", "Scalar Chain", "Centralization"], a: 0, e: "Receiving orders from multiple bosses creates confusion, conflict, and shifting of blame." },
            { q: "Which principle states that all activities having the same objective should be directed by one manager using one plan?", options: ["Unity of Direction", "Unity of Command", "Order", "Esprit de Corps"], a: 0, e: "Unity of Direction ensures coordinated and focused effort ('One head, one plan')." },
            { q: "What is the difference between Unity of Command and Unity of Direction?", options: ["Command prevents dual subordination; Direction prevents overlapping of activities", "Command applies to machines; Direction applies to people", "There is no difference", "Command is for top management; Direction is for workers"], a: 0, e: "Unity of Command affects the individual employee. Unity of Direction affects the entire department's focus." },
            { q: "Which principle requires that the interests of the organization supersede the personal interests of any individual employee?", options: ["Subordination of Individual Interest to General Interest", "Equity", "Initiative", "Stability of Tenure"], a: 0, e: "The company's goals must always come before personal greed or bias." },
            { q: "Fayol's principle of 'Remuneration of Personnel' advocates for:", options: ["Fair, reasonable, and satisfactory wages for both employees and the employer", "Paying everyone identically regardless of skill", "Paying the absolute minimum legal wage", "Profit sharing for all employees"], a: 0, e: "Fair pay ensures a motivated workforce and a good standard of living." },
            { q: "What does 'Centralization' mean in Fayol's principles?", options: ["Concentration of decision-making authority at the top level of management", "Dispersal of authority to lower levels", "Putting the office in the center of the city", "Giving workers full control"], a: 0, e: "Fayol argued for a balance between Centralization (top control) and Decentralization (delegating to subordinates)." },
            { q: "The formal line of authority linking all managers from the highest to the lowest level is known as the:", options: ["Scalar Chain", "Gang Plank", "Unity of Command", "Order"], a: 0, e: "The Scalar Chain dictates the strict chain of communication up and down the hierarchy." },
            { q: "What is a 'Gang Plank' in the context of the Scalar Chain?", options: ["A shortcut allowing direct communication between employees of the same level in emergencies to avoid delays", "A wooden board used in construction", "A tool to fire employees", "A method of punishing workers"], a: 0, e: "Fayol introduced the Gang Plank so the rigid Scalar Chain wouldn't slow down urgent communication." },
            { q: "Which of Fayol's principles states 'A place for everything, and everything in its place'?", options: ["Order", "Equity", "Discipline", "Standardization"], a: 0, e: "Order refers to material order (things in the right place) and social order (the right person in the right job)." },
            { q: "Which principle advocates for kind, fair, and just treatment of employees by managers?", options: ["Equity", "Equality", "Esprit de Corps", "Remuneration"], a: 0, e: "Equity does not mean identical treatment, but fair, unbiased, and just treatment based on circumstances." },
            { q: "What does the principle 'Stability of Tenure of Personnel' aim to achieve?", options: ["Reducing employee turnover by providing job security to maximize efficiency", "Allowing managers to fire anyone instantly", "Transferring employees to different departments daily", "Hiring temporary contract workers"], a: 0, e: "High turnover is costly and inefficient. Workers need time to settle into a job to become productive." },
            { q: "Which principle encourages employees to think out and execute plans for improvement on their own?", options: ["Initiative", "Esprit de Corps", "Division of Work", "Centralization"], a: 0, e: "Allowing employees to take initiative boosts their morale and brings innovation to the company." },
            { q: "What does 'Esprit de Corps' mean?", options: ["Promoting team spirit, harmony, and unity among employees", "Every man for himself", "Strict military discipline", "Division of labor"], a: 0, e: "Management should use 'We' instead of 'I' to foster a sense of belonging and teamwork." },
            { q: "Fayol divided industrial activities into six groups. Which of the following is NOT one of them?", options: ["Political", "Technical", "Commercial", "Financial"], a: 0, e: "Fayol's six groups were Technical, Commercial, Financial, Security, Accounting, and Managerial." },
            { q: "While Taylor's Scientific Management focuses heavily on the shop floor, Fayol's Administrative Management focuses on:", options: ["Top Management and overall organizational structure", "The workers' tools", "Time and motion studies", "Customer satisfaction"], a: 0, e: "Fayol took a top-down approach, looking at the organization from the manager's perspective." },
            { q: "If a manager punishes a worker for a mistake but ignores a friend who makes the same mistake, which principle is violated?", options: ["Equity", "Order", "Initiative", "Scalar Chain"], a: 0, e: "Equity demands impartial and fair treatment for all employees." },
            { q: "If a sales manager receives instructions from both the Marketing Director and the Finance Director simultaneously, which principle is violated?", options: ["Unity of Command", "Unity of Direction", "Division of Work", "Esprit de Corps"], a: 0, e: "Receiving orders from two bosses violates the principle of Unity of Command." },
            { q: "A company constantly hires and fires workers every two months. Which principle is severely violated?", options: ["Stability of Tenure", "Initiative", "Discipline", "Order"], a: 0, e: "Constant firing prevents workers from feeling secure or becoming proficient, violating Stability of Tenure." },
            { q: "What was the name of Henry Fayol's famous book published in 1916?", options: ["General and Industrial Management", "The Principles of Scientific Management", "The Practice of Management", "Modern Administration"], a: 0, e: "Originally published in French ('Administration Industrielle et Générale'), this book laid the groundwork for management theory." },
            { q: "Which of the following is the best summary of Fayol's vs. Taylor's approaches?", options: ["Taylor focused on worker efficiency (bottom-up), while Fayol focused on managerial administration (top-down)", "Both focused exclusively on workers", "Both focused exclusively on CEOs", "Taylor was French, Fayol was American"], a: 0, e: "Taylor aimed to maximize the output of a single worker. Fayol aimed to optimize the entire management structure." }
        ];

        let currentIdx = 0, score = 0, answered = false;

        function startQuiz() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            
            const totalQuestions = questions.length;
            document.getElementById('progress-text').innerText = `Question 1/${totalQuestions}`;
            document.getElementById('final-total').innerText = `Correct out of ${totalQuestions}`;
            
            // Randomize options for each question initially
            questions.forEach(q => {
                const originalCorrect = q.options[q.a];
                
                // Fisher-Yates shuffle for options
                for (let i = q.options.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [q.options[i], q.options[j]] = [q.options[j], q.options[i]];
                }
                
                // Find new index of the correct answer
                q.a = q.options.indexOf(originalCorrect);
            });

            loadQuestion();
        }

        function loadQuestion() {
            const q = questions[currentIdx];
            const totalQuestions = questions.length;
            
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('progress-text').innerText = `Question ${currentIdx + 1}/${totalQuestions}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / totalQuestions) * 100}%`;
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-2xl border-2 border-slate-100 hover:border-amber-400 hover:bg-amber-50 font-medium text-sm text-slate-700 transition-all";
                btn.innerText = opt;
                btn.onclick = () => selectOption(i, btn);
                container.appendChild(btn);
            });
            
            document.getElementById('explanation-box').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');
            answered = false;
        }

        function selectOption(idx, btn) {
            if (answered) return;
            answered = true;
            
            const q = questions[currentIdx];
            const allBtns = document.querySelectorAll('#options-container button');
            
            if (idx === q.a) {
                score++;
                btn.classList.add('border-green-500', 'bg-green-50', 'text-green-700');
                document.getElementById('score-text').innerText = `Score: ${score}`;
            } else {
                btn.classList.add('border-red-500', 'bg-red-50', 'text-red-700');
                allBtns[q.a].classList.add('border-green-500', 'bg-green-50', 'text-green-700');
            }
            
            const exp = document.getElementById('explanation-box');
            exp.innerHTML = `<strong>Explanation:</strong> ${q.e}`;
            exp.classList.remove('hidden');
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            if (currentIdx < questions.length - 1) {
                currentIdx++;
                loadQuestion();
            } else {
                document.getElementById('quiz-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.remove('hidden');
                document.getElementById('final-score').innerText = score;
            }
        }
    </script>
